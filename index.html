<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imposter Who?</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div class="logo-box">
        <h1>IMPOSTER<br>WHO?</h1>
      </div>
      <button id="mute-btn" class="icon-btn" aria-label="Toggle Sound">🔊</button>
    </header>

    <section id="setup-screen" class="card-screen">
      <div class="setup-scroll-area">
        
        <div class="section-card">
          <div class="section-header-row">
            <label class="section-title">✋ PLAYERS (<span id="player-count-label">0</span>)</label>
          </div>
          <div class="input-with-btn">
            <input type="text" id="player-name-input" placeholder="Enter player name" maxlength="15">
            <button id="add-player-btn" class="btn primary-btn-sm">Add</button>
          </div>
          <ul id="player-list" class="player-tags"></ul>
        </div>

        <div class="section-card">
          <label class="section-title">🐔 CATEGORIES</label>
          <select id="category-select" class="custom-select"></select>
        </div>

        <div class="section-card">
          <label class="section-title">🥷 IMPOSTERS</label>
          <select id="impostor-count-select" class="custom-select">
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>

        <div class="section-card">
          <div class="toggle-row">
            <div>
              <label class="section-title">💡 NO-CLUE MODE</label>
            </div>
            <input type="checkbox" id="no-clue-toggle" class="toggle-switch">
          </div>
        </div>

        <div class="section-card">
          <div class="toggle-row">
            <div>
              <label class="section-title">😜 TROLL MODE</label>
            </div>
            <input type="checkbox" id="troll-mode-toggle" class="toggle-switch" checked>
          </div>
        </div>

      </div>

      <div class="bottom-actions">
        <button id="start-game-btn" class="btn start-btn" disabled>▶ START GAME</button>
      </div>
    </section>

    <section id="reveal-screen" class="card-screen hidden">
      <div class="step-indicator">
        PLAYER <span id="current-player-index">1</span> OF <span id="total-players-index">4</span>
      </div>

      <div id="hold-card-wrapper" class="hold-card-wrapper">
        <div id="hold-card-inner" class="hold-card-inner">
          <div class="hold-card-front">
            <h2 id="current-player-name" class="player-title">PLAYER</h2>
            <p class="hold-subtext">Keep your word secret!</p>
            <div class="hold-icon-wrapper">
              <span class="hold-icon">👆</span>
            </div>
            <p class="hold-instruction">HOLD TO REVEAL</p>
          </div>
          
          <div class="hold-card-back">
            <p class="word-label">Your secret word is:</p>
            <h3 id="secret-word-display">WORD</h3>
          </div>
        </div>
      </div>

      <div class="bottom-actions visibility-hidden">
        <button id="next-player-btn" class="btn start-btn">Next Player</button>
      </div>
    </section>

    <section id="starter-screen" class="card-screen hidden">
      <div class="starter-card">
        <h2 class="card-subtitle">Game Started</h2>
        <p class="hold-subtext">Starts the conversation first:</p>
        <h1 id="starter-player-name" class="player-title display-name">-</h1>
      </div>

      <div class="bottom-actions">
        <button id="proceed-btn" class="btn start-btn">Continue</button>
      </div>
    </section>

    <section id="results-screen" class="card-screen hidden">
      
      <div id="results-card-wrapper" class="hold-card-wrapper">
        <div id="results-card-inner" class="hold-card-inner">
          
          <div class="hold-card-front classified-front">
            <div class="classified-stamp">TOP SECRET</div>
            <p class="hold-subtext" style="color: #000; margin-top: 12px;">Game Over!</p>
            <p class="hold-instruction">TAP BUTTON BELOW TO REVEAL</p>
          </div>
          
          <div class="hold-card-back results-back">
            <div id="impostor-names-display" class="impostor-names-list">
              </div>
            
            <div class="divider-line"></div>
            
            <p class="word-label">SECRET WORD</p>
            <h3 id="civilian-word-display" class="revealed-word-text">WORD</h3>
          </div>

        </div>
      </div>

      <div class="bottom-actions">
        <button id="show-impostor-btn" class="btn start-btn">🔍 SHOW IMPOSTOR</button>
        <button id="new-game-btn" class="btn start-btn hidden">Play Again</button>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
