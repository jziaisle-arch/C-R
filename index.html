<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imposter Who?</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div class="logo-box">
        <h1>IMPOSTER<br>WHO?</h1>
      </div>
      <button id="mute-btn" class="icon-btn" aria-label="Toggle Sound">🔊</button>
    </header>

    <section id="setup-screen" class="card-screen">
      <div class="setup-scroll-area">
        
        <div class="section-card">
          <div class="section-header-row">
            <label class="section-title">PLAYERS (<span id="player-count-label">0</span>)</label>
          </div>
          <div class="input-with-btn">
            <input type="text" id="player-name-input" placeholder="Enter name" maxlength="15">
            <button id="add-player-btn" class="btn primary-btn-sm">Add</button>
          </div>
          <ul id="player-list" class="player-tags"></ul>
        </div>

        <div class="section-card">
          <label class="section-title">CATEGORY</label>
          <select id="category-select" class="custom-select"></select>
        </div>

        <div class="section-card">
          <label class="section-title">IMPOSTERS</label>
          <select id="impostor-count-select" class="custom-select">
            <option value="1" selected>1 Imposter</option>
            <option value="2">2 Imposters</option>
            <option value="3">3 Imposters</option>
          </select>
        </div>

        <div class="section-card">
          <div class="toggle-row">
            <div>
              <label class="section-title">NO-CLUE MODE</label>
              <p class="section-desc">Imposters receive "???" instead of a word clue.</p>
            </div>
            <input type="checkbox" id="no-clue-toggle" class="toggle-switch">
          </div>
        </div>

      </div>

      <div class="bottom-actions">
        <button id="start-game-btn" class="btn start-btn" disabled>Start Game</button>
      </div>
    </section>

    <section id="privacy-screen" class="card-screen hidden">
      <div class="hold-card-container starter-card">
        <h2 class="card-subtitle">PASS THE DEVICE</h2>
        <p class="hold-subtext">Hand the device to:</p>
        <h1 id="next-up-player-name" class="player-title display-name">-</h1>
      </div>

      <button id="confirm-pass-btn" class="btn start-btn">Proceed</button>
    </section>

    <section id="reveal-screen" class="card-screen hidden">
      <div class="step-indicator">
        PLAYER <span id="current-player-index">1</span> OF <span id="total-players-index">4</span>
      </div>

      <div id="hold-card" class="hold-card-container">
        <div class="hold-card-front">
          <h2 id="current-player-name" class="player-title">PLAYER</h2>
          <p class="hold-subtext">Keep your screen hidden from others.</p>
          <div class="hold-icon-wrapper">
            <span class="hold-icon">👆</span>
          </div>
          <p class="hold-instruction">HOLD TO REVEAL</p>
        </div>
        
        <div id="hold-card-back" class="hold-card-back hidden">
          <p class="word-label">Your secret word:</p>
          <h3 id="secret-word-display">WORD</h3>
        </div>
      </div>

      <button id="next-player-btn" class="btn start-btn hidden">Next Player</button>
    </section>

    <section id="starter-screen" class="card-screen hidden">
      <div class="hold-card-container starter-card">
        <p class="hold-subtext">First to speak:</p>
        <h1 id="starter-player-name" class="player-title display-name">-</h1>
      </div>

      <button id="proceed-btn" class="btn start-btn">Continue</button>
    </section>

    <section id="results-screen" class="card-screen hidden">
      <h2 class="screen-title">GAME SUMMARY</h2>
      
      <button id="show-impostor-btn" class="btn reveal-impostor-btn">Reveal Imposter</button>
      
      <div id="results-summary" class="results-container hidden"></div>
      
      <button id="new-game-btn" class="btn start-btn spacing-top">Play Again</button>
    </section>
  </div>

  <canvas id="confetti-canvas"></canvas>
  <script src="script.js"></script>
</body>
</html>
